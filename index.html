<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#18181b" />
  <title>Miga — Gestión gastronómica</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { 50:'#fff7ed',100:'#ffedd5',500:'#f97316',600:'#ea580c',700:'#c2410c' } } } } };
  </script>
  <style>
    :root { color-scheme: dark; }
    body { background:#09090b; color:#f4f4f5; }
    input,select,button { font:inherit; }
    input,select { color-scheme:dark; }
    .panel { background:#18181b; border:1px solid #27272a; }
    .field { width:100%; border:1px solid #3f3f46; background:#09090b; color:#f4f4f5; border-radius:.75rem; padding:.7rem .85rem; outline:none; }
    .field:focus { border-color:#f97316; box-shadow:0 0 0 3px #f9731630; }
    .label { display:block; color:#a1a1aa; font-size:.78rem; font-weight:600; margin-bottom:.4rem; }
    .tab-btn { white-space:nowrap; border:1px solid #27272a; color:#a1a1aa; border-radius:.75rem; padding:.65rem .9rem; font-size:.85rem; font-weight:600; transition:.15s; }
    .tab-btn.active { color:#fff; border-color:#f97316; background:#f9731618; }
    .btn-primary { background:#ea580c; color:white; border-radius:.7rem; padding:.65rem .9rem; font-weight:700; transition:.15s; }
    .btn-primary:hover { background:#c2410c; }
    .btn-secondary { background:#27272a; color:#e4e4e7; border:1px solid #3f3f46; border-radius:.7rem; padding:.6rem .8rem; font-weight:600; }
    .btn-secondary:hover { background:#3f3f46; }
    .table-wrap { overflow-x:auto; }
    th { color:#a1a1aa; font-weight:600; font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; }
    td,th { padding:.8rem .75rem; text-align:left; border-bottom:1px solid #27272a; }
    .low-stock { color:#fca5a5; background:#7f1d1d33; border:1px solid #7f1d1d; }
    .toast { animation: fade 3.2s forwards; }
    @keyframes fade { 0%,75%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-8px);pointer-events:none} }
    .scrollbar::-webkit-scrollbar { height:8px;width:8px }.scrollbar::-webkit-scrollbar-thumb{background:#3f3f46;border-radius:8px}
  </style>
</head>
<body class="min-h-screen antialiased">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-5 sm:py-8">
    <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-5 mb-7">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-orange-500/15 border border-orange-500/30 flex items-center justify-center text-2xl">🥐</div>
        <div><p class="text-xs uppercase tracking-[.2em] text-orange-400 font-bold">Miga · Gestión gastronómica</p><h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Tu negocio, en orden</h1></div>
      </div>
      <div class="flex flex-wrap gap-2">
        <button id="exportBtn" class="btn-secondary text-sm">⬇ Exportar JSON</button>
        <label class="btn-secondary text-sm cursor-pointer">⬆ Importar JSON<input id="importFile" type="file" accept="application/json,.json" class="hidden"></label>
        <button id="clearBtn" class="btn-secondary text-sm text-red-300">Limpiar datos</button>
      </div>
    </header>

    <section id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6"></section>
    <nav class="flex gap-2 overflow-x-auto scrollbar pb-2 mb-5" aria-label="Secciones">
      <button class="tab-btn active" data-tab="inventory">📦 Insumos</button>
      <button class="tab-btn" data-tab="recipes">🥐 Recetas & Costos</button>
      <button class="tab-btn" data-tab="profit">📊 Ganancia y Venta</button>
      <button class="tab-btn" data-tab="sales">📋 Stock por Venta</button>
      <button class="tab-btn" data-tab="overhead">🧾 Costos indirectos</button>
    </nav>
    <main id="app"></main>
    <footer class="text-center text-xs text-zinc-600 mt-8">Tus datos se guardan en este navegador mediante localStorage.</footer>
  </div>
  <div id="toastHost" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'miga-gastronomia-v1';
  const units = { g: 'Gramos', kg: 'Kilos', ml: 'Mililitros', l: 'Litros', unit: 'Unidades' };
  const baseUnits = { g:'g', kg:'g', ml:'ml', l:'ml', unit:'unidad' };
  let state = loadState();
  let activeTab = 'inventory';
  let editingIngredient = null;
  let editingRecipe = null;
  let recipeDraft = [];
  const $ = (s,root=document) => root.querySelector(s);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = value => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(Number(value)||0);
  const num = value => Number(value) || 0;
  const id = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
  function freshState(){ return {ingredients:[],recipes:[],sales:[],overheads:[],monthlyUnits:100}; }
  function loadState(){ try { const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)); return {ingredients:Array.isArray(parsed?.ingredients)?parsed.ingredients.map(i=>({...i,priceHistory:Array.isArray(i.priceHistory)?i.priceHistory:[]})):[],recipes:Array.isArray(parsed?.recipes)?parsed.recipes:[],sales:Array.isArray(parsed?.sales)?parsed.sales:[],overheads:Array.isArray(parsed?.overheads)?parsed.overheads:[],monthlyUnits:Number(parsed?.monthlyUnits)||100}; } catch { return freshState(); } }
  function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); render(); }
  function toast(message,type='ok'){ const el=document.createElement('div'); el.className=`toast panel rounded-xl px-4 py-3 shadow-xl text-sm ${type==='error'?'text-red-300':'text-zinc-100'}`; el.textContent=message; $('#toastHost').append(el); setTimeout(()=>el.remove(),3300); }
  function unitFactor(unit){ return unit==='kg'||unit==='l'?1000:1; }
  function unitName(unit){ return unit==='kg'?'g':unit==='l'?'ml':unit==='unit'?'unidad':unit; }
  function normalizedQuantity(amount,unit){ return num(amount)*unitFactor(unit); }
  function quantityLabel(ingredient,amount){ const u=ingredient.baseUnit||unitName(ingredient.purchaseUnit); return `${new Intl.NumberFormat('es-AR',{maximumFractionDigits:3}).format(amount)} ${u}`; }
  function ingredientCost(ingredient,amount){ return num(ingredient.unitCost)*num(amount); }
  function ingredientRecipeCost(recipe){ return (recipe.items||[]).reduce((sum,item)=>{ const ing=state.ingredients.find(x=>x.id===item.ingredientId); return sum+(ing?ingredientCost(ing,item.amount):0); },0); }
  function overheadForRecipe(recipe){ const monthly=state.overheads.filter(x=>x.basis==='monthly').reduce((s,x)=>s+num(x.amount),0)/Math.max(1,num(state.monthlyUnits)); const perUnit=state.overheads.filter(x=>x.basis==='unit').reduce((s,x)=>s+num(x.amount),0); const base=ingredientRecipeCost(recipe)+monthly+perUnit; return {monthly,perUnit,percent:base*num(recipe.overheadPercent)/100,total:monthly+perUnit+base*num(recipe.overheadPercent)/100}; }
  function recipeCostForItems(items,percent=0){ const recipe={items,overheadPercent:percent}; return ingredientRecipeCost(recipe)+overheadForRecipe(recipe).total; }
  function recipeCost(recipe){ return ingredientRecipeCost(recipe)+overheadForRecipe(recipe).total; }
  function recipePrice(recipe){ const cost=recipeCost(recipe); return cost*(1+num(recipe.margin)/100); }
  function recipeProfit(recipe){ return recipePrice(recipe)-recipeCost(recipe); }
  function stockAlert(ingredient){ const stock=num(ingredient.stock); return stock<=0?'Sin stock':stock<=num(ingredient.lowStock)?'Stock bajo':null; }
  function statCard(label,value,icon,note=''){ return `<div class="panel rounded-2xl p-4"><div class="flex justify-between items-start"><div><p class="text-xs text-zinc-500 font-semibold">${label}</p><p class="text-xl font-bold mt-1">${value}</p>${note?`<p class="text-xs text-zinc-500 mt-1">${note}</p>`:''}</div><span class="text-xl">${icon}</span></div></div>`; }
  function renderStats(){ const low=state.ingredients.filter(i=>stockAlert(i)).length; const sold=state.sales.reduce((s,x)=>s+num(x.quantity),0); $('#stats').innerHTML=[statCard('Insumos',state.ingredients.length,'📦'),statCard('Recetas',state.recipes.length,'🥐'),statCard('Alertas de stock',low,'⚠️',low?'Revisá existencias':'Todo en orden'),statCard('Unidades vendidas',sold,'🧾')].join(''); }
  const tabs = {inventory:renderInventory,recipes:renderRecipes,profit:renderProfit,sales:renderSales,overhead:renderOverheads};
  function render(){ renderStats(); document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab)); $('#app').innerHTML=tabs[activeTab](); bindTab(); }
  function renderInventory(){
    const edit=editingIngredient&&state.ingredients.find(i=>i.id===editingIngredient);
    return `<div class="grid lg:grid-cols-[350px_1fr] gap-5">
      <section class="panel rounded-2xl p-5 h-fit"><div class="mb-5"><h2 class="text-lg font-bold">${edit?'Editar insumo':'Agregar insumo'}</h2><p class="text-sm text-zinc-500 mt-1">El costo por unidad base se calcula automáticamente.</p></div>
        <form id="ingredientForm" class="space-y-4">
          <div><label class="label">Nombre del insumo</label><input class="field" name="name" required maxlength="80" placeholder="Ej. Queso mozzarella" value="${esc(edit?.name||'')}"></div>
          <div class="grid grid-cols-2 gap-3"><div><label class="label">Cantidad comprada</label><input class="field" name="quantity" type="number" min="0.001" step="any" required placeholder="1" value="${edit?edit.quantityBought:''}"></div><div><label class="label">Unidad de compra</label><select class="field" name="purchaseUnit">${Object.entries(units).map(([k,v])=>`<option value="${k}" ${(edit?.purchaseUnit||'kg')===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
          <div><label class="label">Costo total de compra ($)</label><input class="field" name="totalCost" type="number" min="0" step="any" required placeholder="8000" value="${edit?edit.totalCost:''}"></div>
          <div class="grid grid-cols-2 gap-3"><div><label class="label">Stock disponible</label><input class="field" name="stock" type="number" min="0" step="any" required placeholder="1000" value="${edit?edit.stock:''}"></div><div><label class="label">Unidad del stock</label><select class="field" name="stockUnit">${Object.entries(units).map(([k,v])=>`<option value="${k}" ${(edit?.stockUnit||'g')===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
          <div><label class="label">Avisarme cuando baje de</label><input class="field" name="lowStock" type="number" min="0" step="any" value="${edit?edit.lowStock:100}" placeholder="100"><p class="text-xs text-zinc-600 mt-1">En la misma unidad base que el stock (g, ml o unidad).</p></div>
          <div id="unitPreview" class="rounded-xl bg-zinc-900 p-3 text-sm text-zinc-400">Ingresá cantidad y costo para ver costo unitario.</div>
          <div class="flex gap-2"><button class="btn-primary flex-1" type="submit">${edit?'Guardar cambios':'Agregar insumo'}</button>${edit?'<button id="cancelIngredient" class="btn-secondary" type="button">Cancelar</button>':''}</div>
        </form>
      </section>
      <section class="panel rounded-2xl p-5"><div class="flex justify-between items-center mb-4"><div><h2 class="text-lg font-bold">Inventario</h2><p class="text-sm text-zinc-500">${state.ingredients.length} insumo${state.ingredients.length===1?'':'s'} registrados</p></div></div>
        ${state.ingredients.length?`<div class="table-wrap scrollbar"><table class="w-full min-w-[760px]"><thead><tr><th>Insumo</th><th>Stock disponible</th><th>Costo / unidad</th><th>Compra</th><th>Estado</th><th></th></tr></thead><tbody>${state.ingredients.map(i=>{const alert=stockAlert(i),history=[...(i.priceHistory||[])].reverse(),affected=state.recipes.filter(r=>r.items.some(x=>x.ingredientId===i.id));return `<tr><td class="font-semibold">${esc(i.name)}${history.length?`<details class="mt-2 text-xs text-zinc-400"><summary class="cursor-pointer text-orange-300">Historial (${history.length})</summary><div class="mt-2 space-y-1">${history.map((h,n)=>`<p>${new Date(h.date).toLocaleDateString('es-AR')} · ${money(h.totalCost)} (${money(h.unitCost)}/${esc(i.baseUnit)})${n<history.length-1?` · ${h.changePercent>=0?'+':''}${num(h.changePercent).toFixed(1)}%`:''}</p>`).join('')}<p class="text-orange-200 pt-1">Variación acumulada: ${num(history[0]?.changePercentTotal).toFixed(1)}%</p></div></details>`:'<p class="text-[11px] text-zinc-600 mt-1">Sin cambios de precio registrados</p>'}${affected.length&&history.length?`<p class="text-[11px] text-amber-300 mt-1">Revisar margen: ${affected.map(r=>esc(r.name)).join(', ')}</p>`:''}</td><td>${quantityLabel(i,num(i.stock))}</td><td>${money(i.unitCost)} / ${esc(i.baseUnit)}</td><td>${money(i.totalCost)} <span class="text-zinc-500">/ ${esc(i.quantityBought)} ${esc(units[i.purchaseUnit])}</span></td><td>${alert?`<span class="rounded-full px-2.5 py-1 text-xs font-bold ${num(i.stock)<=0?'bg-red-500/15 text-red-300':'low-stock'}">${alert}</span>`:'<span class="text-emerald-400 text-xs font-semibold">Disponible</span>'}</td><td><div class="flex gap-2"><button class="text-xs text-orange-300 hover:text-orange-200" data-edit-ingredient="${i.id}">Editar</button><button class="text-xs text-red-400 hover:text-red-300" data-delete-ingredient="${i.id}">Eliminar</button></div></td></tr>`}).join('')}</tbody></table></div>`:`<div class="text-center py-14 text-zinc-500"><div class="text-4xl mb-3">🧺</div><p class="font-semibold text-zinc-300">Todavía no hay insumos</p><p class="text-sm mt-1">Agregá tu primera materia prima para comenzar.</p></div>`}
      </section></div>`;
  }
  function renderOverheads(){ return `<div class="grid lg:grid-cols-[380px_1fr] gap-5"><section class="panel rounded-2xl p-5 h-fit"><h2 class="text-lg font-bold">Agregar costo indirecto o fijo</h2><p class="text-sm text-zinc-500 mt-1 mb-5">Los mensuales se prorratean entre las unidades estimadas por mes.</p><form id="overheadForm" class="space-y-4"><div><label class="label">Concepto</label><input class="field" name="name" required maxlength="80" placeholder="Gas, alquiler, empaques..."></div><div><label class="label">Tipo de costo</label><select class="field" name="category"><option value="indirect">Servicio / insumo indirecto</option><option value="fixed">Costo fijo / mano de obra</option></select></div><div><label class="label">Cómo cargarlo</label><select class="field" name="basis"><option value="monthly">Monto mensual (se prorratea)</option><option value="unit">Monto por producto</option></select></div><div><label class="label">Monto ($)</label><input class="field" name="amount" type="number" min="0.01" step="any" required placeholder="50000"></div><button class="btn-primary w-full">Agregar costo</button></form></section><section class="panel rounded-2xl p-5"><h2 class="text-lg font-bold">Costos registrados</h2><div class="mt-4 rounded-xl bg-zinc-900 p-4"><label class="label">Unidades estimadas de producción por mes (para prorrateo)</label><input id="monthlyUnits" class="field" type="number" min="1" step="1" value="${num(state.monthlyUnits)||100}"><p class="text-xs text-zinc-500 mt-2">Costos mensuales totales: <b>${money(state.overheads.filter(x=>x.basis==='monthly').reduce((s,x)=>s+num(x.amount),0))}</b> · Por unidad: <b>${money(state.overheads.filter(x=>x.basis==='monthly').reduce((s,x)=>s+num(x.amount),0)/Math.max(1,num(state.monthlyUnits)))}</b></p></div>${state.overheads.length?`<div class="mt-4 table-wrap scrollbar"><table class="w-full min-w-[520px]"><thead><tr><th>Concepto</th><th>Categoría</th><th>Frecuencia</th><th>Monto</th><th></th></tr></thead><tbody>${state.overheads.map(x=>`<tr><td class="font-semibold">${esc(x.name)}</td><td class="text-zinc-400">${x.category==='fixed'?'Fijo / mano de obra':'Indirecto'}</td><td class="text-zinc-400">${x.basis==='monthly'?'Mensual':'Por producto'}</td><td>${money(x.amount)}</td><td><button class="text-xs text-red-400" data-delete-overhead="${x.id}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="text-sm text-zinc-500 text-center py-8">Aún no hay costos registrados.</p>'}</section></div>`; }
  function recipeForm(){ const edit=editingRecipe&&state.recipes.find(r=>r.id===editingRecipe); const draft=edit?edit.items:recipeDraft; const total=recipeCostForItems(draft,num(edit?.overheadPercent)); const margin=num(edit?.margin??50); const price=edit?total*(1+margin/100):total*(1+margin/100);
    return `<section class="panel rounded-2xl p-5"><div class="flex justify-between gap-3 items-start mb-5"><div><h2 class="text-lg font-bold">${edit?'Editar receta':'Crear receta o producto'}</h2><p class="text-sm text-zinc-500 mt-1">Definí ingredientes por cada unidad vendida.</p></div>${edit?'<button id="cancelRecipe" class="btn-secondary text-sm">Cancelar</button>':''}</div>
      <form id="recipeForm" class="space-y-4"><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3"><div><label class="label">Nombre del producto</label><input class="field" name="name" required maxlength="80" placeholder="Pan relleno de jamón y queso" value="${esc(edit?.name||'')}"></div><div><label class="label">Precio de venta que querés ($)</label><input class="field" name="price" type="number" min="0" step="any" value="${price.toFixed(2)}" required></div><div><label class="label">Margen sobre costo (%)</label><input class="field" name="margin" type="number" min="0" step="any" value="${edit?edit.margin:50}" required></div><div><label class="label">Extra por receta (%)</label><input class="field" name="overheadPercent" type="number" min="0" step="any" value="${num(edit?.overheadPercent)}"><p class="text-xs text-zinc-600 mt-1">Adicional para mano de obra u otros.</p></div></div>
      <div class="rounded-xl border border-zinc-800 p-4"><div class="flex flex-col sm:flex-row gap-3 sm:items-end"><div class="flex-1"><label class="label">Insumo</label><select id="draftIngredient" class="field"><option value="">Elegí un insumo...</option>${state.ingredients.map(i=>`<option value="${i.id}">${esc(i.name)} · ${money(i.unitCost)}/${esc(i.baseUnit)}</option>`).join('')}</select></div><div class="w-full sm:w-44"><label class="label">Cantidad por unidad (${draft.length?esc(state.ingredients.find(i=>i.id===draft[0].ingredientId)?.baseUnit||'unidad'):'unidad base'})</label><input id="draftAmount" class="field" type="number" min="0.001" step="any" placeholder="200"></div><button id="addDraftItem" class="btn-secondary" type="button">＋ Añadir</button></div>
      ${draft.length?`<div class="mt-4 space-y-2">${draft.map((item,index)=>{const ing=state.ingredients.find(i=>i.id===item.ingredientId);if(!ing)return '';return `<div class="flex items-center justify-between gap-3 bg-zinc-900 rounded-lg px-3 py-2 text-sm"><span><b>${esc(ing.name)}</b><span class="text-zinc-500"> · ${quantityLabel(ing,item.amount)}</span></span><span class="flex items-center gap-3"><b>${money(ingredientCost(ing,item.amount))}</b><button type="button" class="text-red-400" data-remove-draft="${index}" aria-label="Quitar">✕</button></span></div>`}).join('')}</div>`:'<p class="text-xs text-zinc-600 mt-3">Aún no agregaste ingredientes.</p>'}</div>
      <div class="grid sm:grid-cols-3 gap-3"><div class="rounded-xl bg-zinc-900 p-4"><p class="text-xs text-zinc-500">Costo por unidad</p><p id="recipeCostPreview" class="text-lg font-bold mt-1">${money(total)}</p></div><div class="rounded-xl bg-zinc-900 p-4"><p class="text-xs text-zinc-500">Precio sugerido</p><p id="recipePricePreview" class="text-lg font-bold mt-1 text-orange-300">${money(price)}</p></div><div class="rounded-xl bg-zinc-900 p-4"><p class="text-xs text-zinc-500">Ganancia por unidad</p><p id="recipeProfitPreview" class="text-lg font-bold mt-1 text-emerald-400">${money(price-total)}</p></div></div>
      <button class="btn-primary" type="submit">${edit?'Guardar receta':'Guardar producto'}</button></form></section>`;
  }
  function renderRecipes(){ return `<div class="space-y-5">${state.ingredients.length?recipeForm():`<section class="panel rounded-2xl p-8 text-center"><div class="text-4xl mb-3">📦</div><h2 class="font-bold">Primero cargá tus insumos</h2><p class="text-sm text-zinc-500 mt-2">Necesitás al menos un insumo en inventario para armar una receta.</p><button class="btn-primary mt-4" data-go="inventory">Ir a Insumos</button></section>`}
      <section class="panel rounded-2xl p-5"><div class="mb-4"><h2 class="text-lg font-bold">Tus productos</h2><p class="text-sm text-zinc-500">Costos y precios sugeridos calculados con el inventario actual.</p></div>${state.recipes.length?`<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-3">${state.recipes.map(r=>`<article class="rounded-xl bg-zinc-900 border border-zinc-800 p-4"><div class="flex justify-between gap-3"><h3 class="font-bold">${esc(r.name)}</h3><span class="text-xs rounded-full bg-zinc-800 px-2 py-1 h-fit">${num(r.margin)}% margen</span></div><div class="grid grid-cols-3 gap-2 mt-4 text-xs"><div><p class="text-zinc-500">Costo</p><p class="font-bold mt-1">${money(recipeCost(r))}</p></div><div><p class="text-zinc-500">Venta</p><p class="font-bold text-orange-300 mt-1">${money(recipePrice(r))}</p></div><div><p class="text-zinc-500">Ganancia</p><p class="font-bold text-emerald-400 mt-1">${money(recipeProfit(r))}</p></div></div><div class="mt-3 text-xs text-zinc-500">${r.items.map(x=>{const i=state.ingredients.find(a=>a.id===x.ingredientId);return i?`${esc(i.name)} (${quantityLabel(i,x.amount)})`:''}).filter(Boolean).join(' · ')||'Sin ingredientes vinculados'}</div><div class="flex gap-3 mt-4 pt-3 border-t border-zinc-800"><button class="text-xs text-orange-300" data-edit-recipe="${r.id}">Editar</button><button class="text-xs text-red-400" data-delete-recipe="${r.id}">Eliminar</button></div></article>`).join('')}</div>`:`<div class="text-center py-10 text-zinc-500">Todavía no hay recetas guardadas.</div>`}</section></div>`; }
  function renderProfit(){ return `<div class="grid lg:grid-cols-[1fr_1fr] gap-5"><section class="panel rounded-2xl p-5"><h2 class="text-lg font-bold">Calculadora de venta</h2><p class="text-sm text-zinc-500 mt-1 mb-5">Probá diferentes precios y márgenes con tus recetas.</p>${state.recipes.length?`<label class="label">Producto</label><select id="profitRecipe" class="field mb-4">${state.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><div class="grid sm:grid-cols-2 gap-3"><div><label class="label">Costo total actual por unidad</label><div id="profitCost" class="field text-zinc-400">—</div></div><div><label class="label">Margen deseado (%)</label><input id="profitMargin" class="field" type="number" min="0" step="any" value="${num(state.recipes[0].margin)}"></div><div><label class="label">Precio de venta ($)</label><input id="profitPrice" class="field" type="number" min="0" step="any"></div><div><label class="label">Ganancia neta por unidad</label><div id="profitNet" class="field text-emerald-400 font-bold">—</div></div></div><p class="text-xs text-zinc-600 mt-3">El costo total suma ingredientes, costos mensuales prorrateados, costos por producto y el porcentaje extra configurado en la receta.</p><div class="mt-5 rounded-xl border border-zinc-800 bg-zinc-900 p-4"><div class="flex items-center justify-between gap-3"><div><h3 class="font-bold">Desglose de costos por unidad</h3><p class="text-xs text-zinc-500 mt-1">Visualizá qué conceptos forman el costo de esta receta.</p></div><span id="breakdownTotal" class="font-bold text-orange-300"></span></div><div id="costBreakdown" class="mt-4 space-y-3"></div></div>`:`<div class="text-center py-12 text-zinc-500"><p class="text-3xl mb-2">📊</p><p>Guardá una receta para usar la calculadora.</p></div>`}</section><section class="panel rounded-2xl p-5"><h2 class="text-lg font-bold">Cómo se calcula</h2><div class="mt-5 space-y-3 text-sm"><div class="rounded-xl bg-zinc-900 p-4"><p class="text-zinc-500 text-xs">Precio sugerido (markup sobre costo)</p><p class="font-mono mt-2">Costo total × (1 + margen ÷ 100)</p></div><div class="rounded-xl bg-zinc-900 p-4"><p class="text-zinc-500 text-xs">Ganancia bruta por unidad</p><p class="font-mono mt-2">Precio de venta − costo total</p></div><div id="profitSummary" class="rounded-xl border border-orange-500/20 bg-orange-500/5 p-4 text-orange-200">Seleccioná una receta para ver el detalle.</div></div></section></div>`; }  function renderSales(){ const sold=state.sales.reduce((s,x)=>s+num(x.quantity),0); return `<div class="grid lg:grid-cols-[1fr_340px] gap-5"><section class="panel rounded-2xl p-5"><h2 class="text-lg font-bold">Registrar venta y descontar stock</h2><p class="text-sm text-zinc-500 mt-1 mb-5">Cada venta descuenta automáticamente los ingredientes de una receta.</p>${state.recipes.length?`<div class="grid sm:grid-cols-2 gap-3">${state.recipes.map(r=>{const shortages=r.items.map(item=>{const i=state.ingredients.find(a=>a.id===item.ingredientId);return i&&num(i.stock)<num(item.amount)?i:null}).filter(Boolean);return `<article class="rounded-xl bg-zinc-900 border border-zinc-800 p-4"><div class="flex justify-between gap-3"><div><h3 class="font-bold">${esc(r.name)}</h3><p class="text-sm text-zinc-500 mt-1">Venta sugerida: ${money(recipePrice(r))} · ${money(recipeProfit(r))} ganancia</p></div><span class="text-xs text-zinc-500">${state.sales.filter(s=>s.recipeId===r.id).reduce((a,x)=>a+num(x.quantity),0)} vend.</span></div>${shortages.length?`<p class="text-xs text-red-300 mt-3">⚠ Stock insuficiente: ${shortages.map(i=>esc(i.name)).join(', ')}</p>`:''}<button class="btn-primary w-full mt-4" data-sell="${r.id}">Registrar venta (+1)</button></article>`}).join('')}</div>`:`<div class="text-center py-14 text-zinc-500"><p class="text-3xl mb-3">🧾</p><p>Creá una receta para registrar ventas.</p></div>`}</section><aside class="panel rounded-2xl p-5"><h2 class="font-bold">Actividad de ventas</h2><p class="text-sm text-zinc-500 mt-1 mb-4">${sold} unidad${sold===1?'':'es'} registradas</p>${state.sales.length?`<div class="space-y-2 max-h-[480px] overflow-y-auto scrollbar">${[...state.sales].reverse().slice(0,60).map(s=>`<div class="flex justify-between gap-2 text-sm border-b border-zinc-800 pb-2"><div><p class="font-semibold">${esc(s.recipeName)}</p><p class="text-xs text-zinc-600">${new Date(s.date).toLocaleString('es-AR')}</p></div><span class="text-emerald-400">+${money(s.price)}</span></div>`).join('')}</div>`:`<div class="text-sm text-zinc-600">Las ventas que registres aparecerán aquí.</div>`}</aside></div>`; }
  function bindTab(){
    if(activeTab==='inventory') bindInventory();
    if(activeTab==='recipes') bindRecipes();
    if(activeTab==='profit') bindProfit();
    if(activeTab==='sales') bindSales();
    if(activeTab==='overhead') bindOverheads();
    document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>switchTab(b.dataset.go));
  }
  function bindInventory(){ const form=$('#ingredientForm'); if(!form)return; const updatePreview=()=>{const fd=new FormData(form),q=num(fd.get('quantity')),cost=num(fd.get('totalCost')),u=fd.get('purchaseUnit'),base=normalizedQuantity(q,u); $('#unitPreview').innerHTML=q&&cost?`<span class="text-zinc-400">Costo unitario:</span> <b class="text-orange-300">${money(cost/base)} por ${esc(unitName(u))}</b>`:'Ingresá cantidad y costo para ver costo unitario.'}; form.oninput=updatePreview; form.onchange=updatePreview; updatePreview(); form.onsubmit=e=>{e.preventDefault();const d=new FormData(form),q=num(d.get('quantity')),cost=num(d.get('totalCost')),purchaseUnit=d.get('purchaseUnit'),stockUnit=d.get('stockUnit');if(baseUnits[purchaseUnit]!==baseUnits[stockUnit]){toast('La unidad del stock debe coincidir con la categoría de la compra (peso, volumen o unidades).','error');return}const old=state.ingredients.find(i=>i.id===editingIngredient),unitCost=cost/normalizedQuantity(q,purchaseUnit),obj={id:editingIngredient||id(),name:String(d.get('name')).trim(),quantityBought:q,purchaseUnit,totalCost:cost,unitCost,baseUnit:baseUnits[purchaseUnit],stock:normalizedQuantity(d.get('stock'),stockUnit),stockUnit,lowStock:normalizedQuantity(d.get('lowStock'),stockUnit),priceHistory:[...(old?.priceHistory||[])]};if(old&&(Math.abs(num(old.totalCost)-cost)>0.000001||Math.abs(num(old.unitCost)-unitCost)>0.000001)){const baselineCost=num(old.baselineUnitCost)||num(old.unitCost),changePercent=num(old.unitCost)?(unitCost/num(old.unitCost)-1)*100:0,changePercentTotal=baselineCost?(unitCost/baselineCost-1)*100:0;obj.baselineUnitCost=baselineCost;obj.priceHistory.push({date:new Date().toISOString(),name:obj.name,totalCost:cost,unitCost,changePercent,changePercentTotal});const affected=state.recipes.filter(r=>r.items.some(x=>x.ingredientId===old.id));if(unitCost>num(old.unitCost)&&affected.length)setTimeout(()=>toast(`Aumento registrado. Revisá el margen de: ${affected.map(r=>r.name).join(', ')}`,'error'),50)}if(editingIngredient){state.ingredients=state.ingredients.map(i=>i.id===editingIngredient?obj:i);toast('Insumo actualizado.')}else{state.ingredients.push({...obj,priceHistory:[]});toast('Insumo agregado al inventario.')}editingIngredient=null;save()}; $('#cancelIngredient')?.addEventListener('click',()=>{editingIngredient=null;render()}); document.querySelectorAll('[data-edit-ingredient]').forEach(b=>b.onclick=()=>{editingIngredient=b.dataset.editIngredient;render()}); document.querySelectorAll('[data-delete-ingredient]').forEach(b=>b.onclick=()=>{const ing=state.ingredients.find(i=>i.id===b.dataset.deleteIngredient);if(!ing)return;if(!confirm(`¿Eliminar “${ing.name}”? Las recetas que lo usan perderán ese ingrediente.`))return;state.ingredients=state.ingredients.filter(i=>i.id!==ing.id);state.recipes.forEach(r=>r.items=r.items.filter(x=>x.ingredientId!==ing.id));toast('Insumo eliminado.');save()}); }
  function bindRecipes(){ const form=$('#recipeForm'); if(!form)return; const edit=editingRecipe&&state.recipes.find(r=>r.id===editingRecipe); let draft=edit?edit.items.map(x=>({...x})):recipeDraft; const updateTotals=(source='margin')=>{const total=recipeCostForItems(draft,num(form.elements.overheadPercent.value));let margin=num(form.elements.margin.value),price=num(form.elements.price.value);if(source==='price'){margin=total>0?(price/total-1)*100:0;form.elements.margin.value=margin.toFixed(2)}else{price=total*(1+margin/100);form.elements.price.value=price.toFixed(2)}$('#recipeCostPreview').textContent=money(total);$('#recipePricePreview').textContent=money(price);$('#recipeProfitPreview').textContent=money(price-total)}; form.elements.margin.oninput=()=>updateTotals('margin');form.elements.price.oninput=()=>updateTotals('price');form.elements.overheadPercent.oninput=()=>updateTotals('margin'); $('#addDraftItem').onclick=()=>{const ingredientId=$('#draftIngredient').value,amount=num($('#draftAmount').value);if(!ingredientId||!amount){toast('Elegí un insumo e ingresá una cantidad.','error');return}const existing=draft.find(x=>x.ingredientId===ingredientId);existing?existing.amount+=amount:draft.push({ingredientId,amount});recipeDraft=draft;render()}; document.querySelectorAll('[data-remove-draft]').forEach(b=>b.onclick=()=>{draft.splice(Number(b.dataset.removeDraft),1);recipeDraft=draft;render()}); form.onsubmit=e=>{e.preventDefault();if(!draft.length){toast('Agregá al menos un ingrediente a la receta.','error');return}const data=new FormData(form),overheadPercent=num(data.get('overheadPercent')),total=recipeCostForItems(draft,overheadPercent),price=num(data.get('price'));if(total>0&&price<total){toast('El precio no puede ser menor al costo total, incluidos los costos indirectos.','error');return}const recipe={id:editingRecipe||id(),name:String(data.get('name')).trim(),overheadPercent,margin:total>0?(price/total-1)*100:0,items:draft.map(x=>({...x}))};if(editingRecipe){state.recipes=state.recipes.map(r=>r.id===editingRecipe?recipe:r);toast('Receta actualizada.')}else{state.recipes.push(recipe);toast('Producto guardado.')}editingRecipe=null;recipeDraft=[];save()}; $('#cancelRecipe')?.addEventListener('click',()=>{editingRecipe=null;recipeDraft=[];render()}); document.querySelectorAll('[data-edit-recipe]').forEach(b=>b.onclick=()=>{editingRecipe=b.dataset.editRecipe;recipeDraft=[];render()}); document.querySelectorAll('[data-delete-recipe]').forEach(b=>b.onclick=()=>{const r=state.recipes.find(x=>x.id===b.dataset.deleteRecipe);if(!r)return;if(!confirm(`¿Eliminar la receta “${r.name}”?`))return;state.recipes=state.recipes.filter(x=>x.id!==r.id);toast('Receta eliminada.');save()}); }
  function bindProfit(){const select=$('#profitRecipe');if(!select)return;const margin=$('#profitMargin'),price=$('#profitPrice');const update=(source='margin')=>{const recipe=state.recipes.find(r=>r.id===select.value);if(!recipe)return;const cost=recipeCost(recipe),base=ingredientRecipeCost(recipe),overhead=overheadForRecipe(recipe);$('#profitCost').textContent=money(cost);if(source==='margin'){price.value=(cost*(1+num(margin.value)/100)).toFixed(2)}const p=num(price.value),net=p-cost,m=cost?((p/cost)-1)*100:0;$('#profitNet').textContent=money(net);$('#profitSummary').innerHTML=`<b>${esc(recipe.name)}</b><br><span class="text-sm">Costo total: ${money(cost)} · Precio: ${money(p)} · Ganancia: ${money(net)}${cost?` · Margen sobre costo: ${m.toFixed(1)}%`:''}</span>`;const components=[];for(const item of recipe.items||[]){const ing=state.ingredients.find(x=>x.id===item.ingredientId);if(ing)components.push({label:`Ingrediente: ${ing.name}`,amount:ingredientCost(ing,item.amount),kind:'ingredient'})}for(const item of state.overheads.filter(x=>x.basis==='monthly'))components.push({label:`${item.name} (mensual ÷ ${num(state.monthlyUnits)} unidades)`,amount:num(item.amount)/Math.max(1,num(state.monthlyUnits)),kind:'overhead'});for(const item of state.overheads.filter(x=>x.basis==='unit'))components.push({label:`${item.name} (por producto)`,amount:num(item.amount),kind:'overhead'});if(num(recipe.overheadPercent)){components.push({label:`Adicional configurado en receta (${num(recipe.overheadPercent)}%)`,amount:overhead.percent,kind:'percent'})}const max=Math.max(cost,...components.map(x=>x.amount),1);$('#breakdownTotal').textContent=money(cost);$('#costBreakdown').innerHTML=components.length?components.map(x=>`<div><div class="flex justify-between gap-3 text-xs mb-1"><span class="text-zinc-300">${esc(x.label)}</span><b>${money(x.amount)}</b></div><div class="h-2 rounded-full bg-zinc-800 overflow-hidden"><div class="h-full rounded-full ${x.kind==='ingredient'?'bg-sky-500':x.kind==='percent'?'bg-violet-500':'bg-orange-500'}" style="width:${Math.min(100,x.amount/max*100)}%"></div></div></div>`).join(''):`<p class="text-sm text-zinc-500">No hay componentes registrados para esta receta.</p>`};margin.oninput=()=>update('margin');price.oninput=()=>update('price');select.onchange=()=>{const r=state.recipes.find(x=>x.id===select.value);margin.value=r?.margin??50;update('margin')};update()}  function bindOverheads(){const form=$('#overheadForm');if(form)form.onsubmit=e=>{e.preventDefault();const d=new FormData(form);state.overheads.push({id:id(),name:String(d.get('name')).trim(),category:d.get('category'),basis:d.get('basis'),amount:num(d.get('amount'))});toast('Costo agregado y disponible para prorratear.');save()};$('#monthlyUnits')?.addEventListener('change',e=>{state.monthlyUnits=Math.max(1,num(e.target.value));save()});document.querySelectorAll('[data-delete-overhead]').forEach(b=>b.onclick=()=>{state.overheads=state.overheads.filter(x=>x.id!==b.dataset.deleteOverhead);save();toast('Costo eliminado.')})}
  function bindSales(){document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{const recipe=state.recipes.find(r=>r.id===b.dataset.sell);if(!recipe)return;const required=new Map();for(const item of recipe.items)required.set(item.ingredientId,(required.get(item.ingredientId)||0)+num(item.amount));const shortage=[];for(const [iid,amount] of required){const ing=state.ingredients.find(i=>i.id===iid);if(!ing||num(ing.stock)<amount)shortage.push(ing?.name||'Insumo eliminado')}if(shortage.length){toast(`Stock insuficiente: ${shortage.join(', ')}.`,'error');return}for(const [iid,amount] of required){const ing=state.ingredients.find(i=>i.id===iid);ing.stock=num(ing.stock)-amount}state.sales.push({id:id(),recipeId:recipe.id,recipeName:recipe.name,quantity:1,price:recipePrice(recipe),date:new Date().toISOString()});toast(`Venta registrada. Stock de “${recipe.name}” actualizado.`);save()})}
  function switchTab(tab){activeTab=tab;render();window.scrollTo({top:0,behavior:'smooth'})}
  document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
  $('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),app:'Miga'},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`miga-respaldo-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);toast('Respaldo JSON descargado.')};
  $('#importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.ingredients)||!Array.isArray(parsed.recipes))throw new Error();if(!confirm('Importar reemplazará los datos actuales. ¿Continuar?'))return;state={ingredients:parsed.ingredients.map(i=>({...i,priceHistory:Array.isArray(i.priceHistory)?i.priceHistory:[]})),recipes:parsed.recipes,sales:Array.isArray(parsed.sales)?parsed.sales:[],overheads:Array.isArray(parsed.overheads)?parsed.overheads:[],monthlyUnits:Number(parsed.monthlyUnits)||100};editingIngredient=editingRecipe=null;recipeDraft=[];save();toast('Datos importados correctamente.')}catch{toast('El archivo no tiene un respaldo válido de Miga.','error')}finally{e.target.value=''}};
  $('#clearBtn').onclick=()=>{if(!confirm('¿Borrar todos los insumos, recetas y ventas guardados en este navegador? Esta acción no se puede deshacer.'))return;state=freshState();editingIngredient=editingRecipe=null;recipeDraft=[];save();toast('Datos locales eliminados.')};
  render();
})();
</script>
